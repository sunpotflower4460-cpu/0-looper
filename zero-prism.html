<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>0-prism — zero is not nothing</title>
<style>
:root{--bg:#07090d;--panel:#10161b;--panel2:#151e24;--line:#26343d;--txt:#e7f0ed;--dim:#8fa09a;--accent:#72d6c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.55}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}h1{font-size:20px;margin:0 0 6px}.sub,.small{color:var(--dim);font-size:13px}.btn{display:inline-block;text-decoration:none;background:#173530;color:var(--txt);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 8px 0 0}canvas{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#030609}#hist{height:430px}#wave{height:90px;margin-top:10px}#modes{height:120px;margin-top:10px}.metric{display:flex;flex-wrap:wrap;gap:12px;color:var(--dim);font-size:13px;margin-top:10px}.metric b{color:var(--txt)}.row{display:flex;gap:8px;flex-wrap:wrap}.button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.primary{background:#173530;border-color:var(--accent)}.note{border:1px solid #3c3420;background:#1a160d;color:#d6bc75;border-radius:10px;padding:10px 12px;font-size:12px;margin:10px 0}</style>
</head>
<body><div class="wrap"><h1>0-prism</h1><div class="sub">0/white が、局所ルールというプリズムでどの波長モードへ分かれるかを見る補助ラボ。</div><a class="btn" href="./index.html">入口へ戻る</a><a class="btn" href="./relation-lab-v2.html">関係性ラボ v2へ</a><div class="note">これは補助実験です。関係性・テンプレートを見たい場合は relation-lab-v2.html を開いてください。</div><div class="card"><canvas id="hist"></canvas><canvas id="wave"></canvas><canvas id="modes"></canvas><div class="metric"><span>step <b id="step">0</b></span><span>mean |u| <b id="amp">0</b></span><span>events <b id="events">0</b></span></div></div><div class="card"><div class="row"><button class="button primary" id="play">▶ 再生</button><button class="button" id="reset">0へ戻す</button></div><p class="small">見方：上は場の時間履歴。縦縞は「差は立ったが関係性の読み取りはまだ薄い」状態。関係性を読みたい場合は v2 ラボで width / longest chain / comparable r を見ます。</p></div></div><script>
const N=160;let u=new Float32Array(N),v=new Float32Array(N),rows=[],step=0,running=false,events=0,seed=1;const P={mu:.9,D:.22,eta:.012,dt:.08};function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}function g(){return (rnd()+rnd()+rnd()+rnd()-2)}function fit(c){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.floor(r.width*d);c.height=Math.floor(r.height*d)}function one(){let prev=u.slice();for(let i=0;i<N;i++){let lap=u[(i-1+N)%N]+u[(i+1)%N]-2*u[i];v[i]=u[i]+P.dt*(P.D*lap+P.mu*u[i]-u[i]*u[i]*u[i]+P.eta*g())}let t=u;u=v;v=t;for(let i=0;i<N;i++)if(Math.abs(u[i])>.62&&Math.abs(prev[i])<=.62)events++;step++;if(step%2===0){rows.push(u.slice());if(rows.length>220)rows.shift()}}function col(x){if(Math.abs(x)<.03)return '#eaf0ec';return x>0?`rgb(${100+Math.min(155,Math.abs(x)*120)},120,210)`:`rgb(80,${130+Math.min(100,Math.abs(x)*120)},230)`}function draw(){let h=document.getElementById('hist'),w=document.getElementById('wave'),m=document.getElementById('modes');fit(h);fit(w);fit(m);let gh=h.getContext('2d'),gw=w.getContext('2d'),gm=m.getContext('2d');gh.clearRect(0,0,h.width,h.height);let cw=h.width/N,ch=h.height/220;rows.forEach((r,y)=>{for(let i=0;i<N;i++){gh.fillStyle=col(r[i]);gh.fillRect(i*cw,y*ch,Math.ceil(cw)+1,Math.ceil(ch)+1)}});gw.clearRect(0,0,w.width,w.height);gw.strokeStyle='#72d6c9';gw.beginPath();for(let i=0;i<N;i++){let x=i/(N-1)*w.width,y=w.height/2-u[i]*w.height*.35;i?gw.lineTo(x,y):gw.moveTo(x,y)}gw.stroke();gm.clearRect(0,0,m.width,m.height);for(let k=1;k<=16;k++){let re=0,im=0;for(let i=0;i<N;i++){let a=Math.PI*2*k*i/N;re+=u[i]*Math.cos(a);im-=u[i]*Math.sin(a)}let amp=Math.hypot(re,im)/N,bw=m.width/16;gm.fillStyle=`hsl(${k*22},75%,58%)`;gm.fillRect((k-1)*bw+2,m.height-amp*800-4,bw-4,amp*800)}document.getElementById('step').textContent=step;document.getElementById('events').textContent=events;document.getElementById('amp').textContent=Array.from(u).reduce((a,b)=>a+Math.abs(b),0/N).toFixed(3)}function loop(){if(running)for(let i=0;i<4;i++)one();draw();requestAnimationFrame(loop)}document.getElementById('play').onclick=()=>{running=!running;play.textContent=running?'⏸ 一時停止':'▶ 再生'};document.getElementById('reset').onclick=()=>{u.fill(0);v.fill(0);rows=[];step=0;events=0};loop();
</script></body></html>
