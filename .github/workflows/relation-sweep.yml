name: relation-one-flow-and-async-sweep

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run relation preset sweep
        run: python3 scripts/relation_sweep.py --mode presets --seeds 30

      - name: Run relation scaling sweep
        run: python3 scripts/relation_sweep.py --mode scaling --seeds 12

      - name: Run relation compact grid sweep
        run: python3 scripts/relation_sweep.py --mode grid --seeds 4 --top 12

      - name: Run one-flow preset sweep
        run: python3 scripts/one_flow_sweep.py --mode presets --seeds 20

      - name: Run one-flow compact grid sweep
        run: python3 scripts/one_flow_sweep.py --mode grid --seeds 3 --top 12

      - name: Run async causal origin summary
        run: python3 scripts/async_causal_origin.py --mode summary --cells 32 --sweeps 32 --seeds 5

      - name: Run async causal origin CTC test
        run: python3 scripts/async_causal_origin.py --mode ctc --cells 32 --sweeps 32 --seeds 5

      - name: Run async causal origin scaling
        run: python3 scripts/async_causal_origin.py --mode scaling --seeds 3
