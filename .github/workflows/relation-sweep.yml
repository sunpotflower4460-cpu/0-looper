name: relation-sweep

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  relation-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run preset sweep
        run: python3 scripts/relation_sweep.py --mode presets --seeds 30

      - name: Run scaling sweep
        run: python3 scripts/relation_sweep.py --mode scaling --seeds 12

      - name: Run compact grid sweep
        run: python3 scripts/relation_sweep.py --mode grid --seeds 4 --top 12
