name: relation-sweep

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  relation-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run relation sweep
        run: python3 scripts/relation_sweep.py --seeds 30
