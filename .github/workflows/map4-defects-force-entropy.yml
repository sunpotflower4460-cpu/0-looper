name: map4-defects-force-entropy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  map4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run A1 controlled vortex dynamics
        run: python3 scripts/vortex_tdgl.py --mode controlled --steps 80

      - name: Run A1b vortex quench coarsening
        run: python3 scripts/vortex_tdgl.py --mode quench --steps 80

      - name: Run A4 defect metric curvature
        run: python3 scripts/defect_metric_curvature.py

      - name: Run A3 vortex metric force
        run: python3 scripts/vortex_metric_force.py

      - name: Run A5 entropic spring
        run: python3 scripts/entropy_action_frontier.py --mode spring

      - name: Run A5 entropy-only triangulation flips
        run: python3 scripts/entropy_action_frontier.py --mode flips

      - name: Run A7 causal restriction proxy
        run: python3 scripts/causal_constraint.py

      - name: Run A6 gravitational instability
        run: python3 scripts/gravity_toys.py --mode instability

      - name: Run A10 weak lensing
        run: python3 scripts/gravity_toys.py --mode lensing

      - name: Run A11 self-gravity equilibrium
        run: python3 scripts/gravity_toys.py --mode equilibrium
