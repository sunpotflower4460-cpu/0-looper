name: beta-arrow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  beta-arrow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run beta Kac ring
        run: python3 scripts/beta_arrow.py --mode kac

      - name: Run beta asymmetry scan
        run: python3 scripts/beta_arrow.py --mode asym

      - name: Run beta complexity window
        run: python3 scripts/beta_arrow.py --mode complexity

      - name: Run beta two-arrow check
        run: python3 scripts/beta_arrow.py --mode twoarrow
